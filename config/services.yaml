# Memory OS — service configuration (single source of truth, committed default)
# Host-specific values (connection IPs/URLs, local paths) carry NO inline default —
# they MUST come from .env per host. Universal structural/operational defaults
# (ports, VALKEY_DB:0, embedding dims, model names, pool/arq/reflection/search tuning)
# stay inline so the file works out-of-box once .env supplies hosts + secrets.
# Local overrides go to config/services.local.yaml (gitignored, deep-merged on top).

postgres:
  host: ${POSTGRES_IP}
  port: ${POSTGRES_PORT:5432}
  user: ${POSTGRES_USER_NAME:postgres}
  password: ${POSTGRES_USER_PASSWORD}
  database: ${POSTGRES_DB:memos}
  pool:
    min_size: 1
    max_size: 4

valkey:                              # Redis-compatible drop-in
  host: ${VALKEY_IP}
  port: ${VALKEY_PORT:6389}
  password: ${VALKEY_PASSWORD}       # empty OK for LAN without auth
  db: ${VALKEY_DB:0}                 # logical DB index — per-agent isolation (tr=0, seo=1, ...)
  arq:
    queue_prefix: "arq:queue:"
    max_jobs: 10
    job_timeout: 300
    keep_result: 3600

qdrant:
  url: ${QDRANT_URL}
  host: ${QDRANT_HOST}
  port: ${QDRANT_PORT:6333}
  api_key: ${QDRANT_API_KEY}         # empty OK
  collection: ${QDRANT_COLLECTION:knowledge_base}

litellm:
  base_url: ${LITELLM_URL}
  api_key: ${LITELLM_API_KEY}
  models:
    embedding:
      name: ${EMBEDDING_MODEL:rapid-mlx-qwen3-embedding-8b}
      dimensions: ${EMBEDDING_DIMENSIONS:4096}
      context_length: ${EMBEDDING_CONTEXT_LENGTH:32768}
      # Client-side HTTP budget for one /embeddings call, seconds. MUST stay
      # above the proxy's own upstream timeout plus one fallback hop, or the
      # client hangs up before the proxy can fail over and the fallback is
      # unreachable. As of 2026-08-21 LiteLLM gives the local Mac Studio
      # deployment (rapid-mlx-qwen3-embedding-8b) 80 s and the OpenRouter
      # fallback answers in ~5 s, so a successful failover costs ~85 s and 100
      # is the smallest safe value.
      #
      # It used to be a hardcoded 60 in services/embedding.py, which is below
      # that sum: 12 of 88 reflection runs on memory-os-tom over 200 h died as
      # `cron:process_reflection failed, ReadTimeout` at ~60 s while a working
      # OpenRouter answer sat one unreachable hop away. Raise the proxy's
      # timeout and you must raise this one with it.
      timeout: ${EMBEDDING_TIMEOUT:100}
      # Comma-separated model groups to fall back to, sent PER REQUEST because
      # the gateway will not apply its own chain. Empty disables it.
      #
      # LiteLLM does hold `router_settings.fallbacks` for the embedding group
      # and reports it via /get/config/callbacks, but it never fires: at
      # router.py:6414 the router reads `kwargs.get("fallbacks", self.fallbacks)`
      # and the key's PRESENCE decides, so the configured list is shadowed and
      # the default branch is never taken. Measured on the same proxy
      # (litellm.airmonitor.pl) 2026-08-21 by boot_email_inbox 0.2.12: without
      # the key in the body 408 after 61.6 s, with it 200 in 62.0 s carrying
      # `x-litellm-attempted-fallbacks: 1`. Verified unchanged in LiteLLM
      # v1.97.0, so waiting for an upgrade is not a plan.
      #
      # SAME MODEL OR NOTHING. Everything listed here must be the same
      # embedder as `name` above - same weights, same `dimensions` - because a
      # differently-shaped vector written into a collection frozen at 4096
      # corrupts the corpus silently. qwen3-embedding-8b is the OpenRouter twin
      # of the local rapid-mlx deployment: same Qwen3-Embedding-8B, different
      # provider. It is also PAID, so an MLX slowdown becomes a bill rather
      # than a stall - the trade is deliberate.
      #
      # Never send an empty list: `[]` is as PRESENT as a full one and shadows
      # the router exactly like `None`. The consumer must omit the key instead.
      fallbacks: ${EMBEDDING_FALLBACKS:qwen3-embedding-8b}
    chat:
      name: ${CHAT_MODEL:lm-studio-qwen3.6}
      max_tokens: 4096
      temperature: 0.7
    extraction:                      # icarus/hooks.py LLM extraction
      name: ${EXTRACTION_MODEL:lm-studio-qwen3.6}
      max_tokens: ${ICARUS_EXTRACTION_MAX_TOKENS:4096}
      # Client budget for one extraction call. Same rule as the embedding
      # timeout above: it must exceed the proxy's own upstream timeout plus one
      # fallback hop, or we hang up before LiteLLM can fail over.
      timeout: ${EXTRACTION_TIMEOUT:100}

paths:                               # SQLite + local paths — host-specific, set in .env
  hermes_home: ${HERMES_HOME}
  state_db: ${STATE_DB_PATH}
  memory_store_db: ${MEMORY_STORE_DB}
  fabric_dir: ${FABRIC_DIR}
  vault: ${VAULT_PATH}
  wiki_root: ${WIKI_ROOT}
  telemetry_log: ${TELEMETRY_LOG_PATH}
  reflection_log: ${REFLECTION_LOG_PATH}

# Reflection budget tuning
reflection:
  max_per_hour: 5
  max_chunks: 10

# Search defaults (context_enhancer)
search:
  top_k: 3
  score_threshold: 0.55
  max_text_len: 8000
  request_timeout: 10

# Session extraction (scripts/session_sweeper.py). Thresholds are policy, and
# the numbers come from measurement: gaps inside one real Slack thread ran
# 0-2 min within a burst and 42 min BETWEEN bursts of the same conversation,
# while different conversations sat 292 min and 1326 min apart. 90 minutes is
# above the largest in-conversation gap observed and far below the smallest
# between-conversation one. Raising it merges more into one entry; lowering it
# below 42 is known to split a real conversation.
session_extraction:
  idle_minutes: ${SESSION_IDLE_MINUTES:90}
  min_messages: ${SESSION_MIN_MESSAGES:4}
  context_overlap: ${SESSION_CONTEXT_OVERLAP:4}
  max_lag_hours: ${SESSION_MAX_LAG_HOURS:24}
  max_per_run: ${SESSION_MAX_PER_RUN:3}
  quality_threshold: ${SESSION_QUALITY_THRESHOLD:0.2}
  # ADR-0002 decision 4: a deterministic failure counts toward this ceiling; a
  # transient one (a LiteLLM outage, say) never does. 3 tries for a genuinely
  # bad slice before it is quarantined.
  max_attempts: ${SESSION_MAX_ATTEMPTS:3}
  # The run-level circuit breaker for CONSECUTIVE transient failures: this
  # many in a row aborts the sweep — a gateway outage, not bad slices.
  transient_abort: ${SESSION_TRANSIENT_ABORT:2}
  # The run-level circuit breaker for deterministic failures spread across
  # DIFFERENT sessions in one run — also a misrouting-gateway shape, since its
  # HTTP-200 door is indistinguishable per slice from a model that genuinely
  # wrote nonsense. A SEPARATE key from transient_abort (fix round 1): sharing
  # one meant raising it to tolerate a flakier network also raised the number
  # of distinct sessions a run could ever touch (bounded by max_per_run),
  # silently disabling this protection once the two crossed.
  deterministic_sessions_abort: ${SESSION_DETERMINISTIC_SESSIONS_ABORT:2}

logging:
  level: INFO
